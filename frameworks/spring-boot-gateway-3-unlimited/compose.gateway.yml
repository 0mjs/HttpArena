# EXPERIMENTAL - not for merge. spring-boot-gateway-3 without CPU limits:
# the same 3 replicas share the server cpuset (20-31,84-95, 24 logical CPUs)
# and compete for it freely, the way pods with requests but no limits do. No
# CFS quota, so nothing throttles a replica that bursts (GC, JIT).
#
# -XX:ActiveProcessorCount=8 keeps the JVM sizing its pools for its request
# share, as it does under the 8-CPU quota in spring-boot-gateway-3; without
# it every JVM would see the full cpuset. Compare against spring-boot-gateway-3
# (limited) and spring-boot-gateway-8-unlimited.
#
# This breaks the gateway-64 rule of exactly one server; it is a measurement,
# not a leaderboard entry.
#
#   48 GiB of memory and 192 Postgres connections in total, as in the limited entries:
#   3 replicas x 8 CPUs (request), 16g and a 64-connection pool each
#
# Replica k listens on 808(k-1); server-1 holds 8080, which the harness probes.

x-server-env: &server-env
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_SIZE: "64"
  # plain HTTP on SERVER_PORT only: no TLS, no h2c upgrade, no extra connector
  SERVER_SSL_ENABLED: "false"
  SERVER_HTTP2_ENABLED: "false"
  HTTP_PORT: "0"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:ActiveProcessorCount=8"

x-server: &server
  build:
    context: ../spring-boot
  network_mode: host
  cpuset: "20-31,84-95"
  mem_limit: 16g
  ulimits:
    memlock: -1
    nofile:
      soft: 1048576
      hard: 1048576
  security_opt:
    - seccomp:unconfined
  volumes:
    - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
  # the port only opens once the Spring context is up; the edge waits for all of them
  healthcheck:
    test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/$$SERVER_PORT'"]
    interval: 30s
    timeout: 2s
    retries: 3
    start_period: 120s
    start_interval: 1s

services:
  proxy:
    build: ./proxy
    network_mode: host
    cpuset: "0-19,64-83"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy

  server-1:
    <<: *server
    environment:
      <<: *server-env
      SERVER_PORT: "8080"

  server-2:
    <<: *server
    environment:
      <<: *server-env
      SERVER_PORT: "8081"

  server-3:
    <<: *server
    environment:
      <<: *server-env
      SERVER_PORT: "8082"
